<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1D1A17"><title>Accounts</title><link rel="icon" id="fav" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,600;1,9..144,450&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F8F5EE;--ivory-deep:#EEE7D9;--card:#FFFDFC;--charcoal:#1D1A17;--charcoal-soft:#655D53;--burgundy:#762B3B;--brass:#A07C45;--sage:#5B7A5B;--brick:#8C4A3E;--line:#D8CCB7;--shadow:0 22px 55px -28px rgba(29,26,23,.30);--s:var(--charcoal);--s2:#302923;--b:var(--charcoal);--bd:var(--burgundy);--i:var(--charcoal);--m:var(--charcoal-soft);--l:var(--line);--bg:var(--ivory);--g:var(--sage);--r:var(--brick);--pk:var(--brass)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ivory);color:var(--charcoal);font:14px/1.5 'Manrope',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Fraunces',serif}h1{font-size:26px;margin:0;font-weight:600;color:var(--charcoal)}h2{font-size:15px;margin:0 0 10px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:flex;min-height:100vh}.app>div{flex:1;min-width:0}
aside{width:230px;flex-shrink:0;background:var(--charcoal);color:var(--ivory);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:22px 0}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;margin-bottom:8px;border-bottom:1px solid rgba(248,245,238,.12)}
.brand img{height:34px;width:auto;max-width:90px;object-fit:contain}
.brand span{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.06em;opacity:.85}
.grp{padding:16px 20px 4px;font:700 10px 'Space Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.item{display:block;width:calc(100% - 24px);margin:2px 12px;text-align:left;background:none;border:0;border-radius:8px;color:rgba(248,245,238,.75);padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
.item:hover{background:rgba(248,245,238,.08);color:var(--ivory)}
.item[aria-current=true]{background:var(--burgundy);color:var(--ivory)}
.top{position:sticky;top:0;z-index:10;background:var(--ivory);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top input{width:min(300px,100%);padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px}
.sp{flex:1}
.org{display:flex;align-items:center;gap:12px}.org img{height:36px;width:auto;max-width:110px;object-fit:contain}.org .sep{color:var(--line)}.org .sec{font-size:14px;color:var(--charcoal-soft)}
.page{padding:24px 28px 80px;max-width:1280px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--charcoal);color:var(--ivory);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:600;font-size:14px;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px -14px rgba(29,26,23,.55)}
.btn.g{background:transparent;color:var(--charcoal);border:1px solid var(--line);box-shadow:none}.btn.g:hover{border-color:var(--charcoal);transform:none}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.lnk{background:none;border:0;color:var(--burgundy);cursor:pointer;padding:0 10px 0 0;font-size:13px;font-weight:600}.lnk:hover{text-decoration:underline}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:16px}.row .panel{margin:0}
.big{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin-bottom:8px}
.bar{height:8px;border-radius:999px;background:var(--ivory-deep);overflow:hidden;display:flex;margin-bottom:12px}.bar i{display:block}
small{color:var(--m);display:block;font-size:12px}
.gain{color:var(--g)}.loss{color:var(--r)}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--charcoal-soft);background:var(--card)}
tbody tr:hover{background:var(--ivory-deep)}tr:last-child td{border-bottom:0}tfoot td{font-weight:700;border-top:1px solid var(--line)}.n,th.n{text-align:right}
.s-paid{color:var(--g);font-weight:600}.s-overdue{color:var(--r);font-weight:600}.s-cancelled{color:var(--m);font-weight:600;text-decoration:line-through}.s-due{color:var(--burgundy);font-weight:600}
.empty{padding:60px 20px;text-align:center;color:var(--m);background:var(--card);border:1px dashed var(--line);border-radius:10px}
.msg{display:flex;gap:8px;background:var(--ivory-deep);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--charcoal-soft)}
input,select,textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ivory);max-width:100%}
td input,td select{width:100%;min-width:60px;padding:7px 10px}
label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--m)}label input,label select,label textarea{font-weight:400;font-size:14px;color:var(--i)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.tot{margin-left:auto;width:min(320px,100%);display:grid;gap:6px;margin-bottom:14px}.tot div{display:flex;justify-content:space-between}.tot .t{font-size:16px;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--i);font-weight:400}.chk input{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;text-align:left}.chip[aria-pressed=true]{border-color:var(--burgundy);box-shadow:0 0 0 1px var(--burgundy)}.top a{text-decoration:none;white-space:nowrap}
.rbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:18px}
.rbar label{min-width:150px}.rbar small{align-self:center;max-width:320px}
dialog{border:0;border-radius:14px;padding:0;width:min(440px,94vw);background:var(--card);box-shadow:0 22px 55px -20px rgba(29,26,23,.45)}dialog::backdrop{background:rgba(29,26,23,.4)}
dialog form{display:grid;gap:12px;padding:22px}
.export-wrap{position:relative;display:inline-flex}.export-menu{position:absolute;right:0;top:calc(100% + 5px);z-index:10;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px}.export-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer;border-radius:6px}.export-menu button:hover{background:var(--ivory-deep)}
@media(max-width:800px){.app{flex-direction:column}aside{width:100%;position:static;height:auto;flex-direction:row;align-items:center;padding:12px 14px;overflow-x:auto}.brand,.grp{display:none}.item{width:auto;white-space:nowrap;margin:0 2px}.top,.page{padding-left:16px;padding-right:16px}}

#loginGate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ivory)}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 32px;box-shadow:var(--shadow)}
.login-card .gate-logo{display:block;width:72px;height:auto;margin-bottom:14px}
.login-card h1{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:8px 0 0;color:var(--charcoal)}
.login-card p{color:var(--charcoal-soft);font-size:14px;margin-top:8px;line-height:1.5}
.login-card .field{margin-top:20px}
.login-card .field label{display:block;font-size:12px;font-weight:500;color:var(--charcoal-soft);margin-bottom:6px}
.login-card .field input{display:block;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--ivory);font-size:14px;color:var(--charcoal);margin-top:6px}
.login-card .field input:focus{outline:2px solid var(--brass);outline-offset:-2px}
.login-card .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:16px;padding:11px 20px;border:0;border-radius:8px;background:var(--charcoal);color:var(--ivory);font-size:14px;font-weight:600;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
.login-card .btn:hover{background:var(--burgundy);transform:translateY(-1px);box-shadow:0 12px 26px -14px rgba(29,26,23,.55)}
.login-card .btn.g{background:transparent;color:var(--charcoal);border:1px solid var(--line);box-shadow:none}
.login-card .btn.g:hover{border-color:var(--charcoal);background:var(--ivory)}
#loginError{display:none;color:var(--brick);font-size:13px;margin-top:14px;padding:0;border:0;background:transparent}
#loginInfo{font-size:12px;color:var(--m);white-space:nowrap}
</style></head><body>

<script>
const KEY='accounts.v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF=()=>({biz:'CLIPPD',entries:[],txns:[],exps:[],jv:[],coa:[],co:{name:'CLIPPD',tag:'YOUR EVERYDAY SLAY',addr:'H No 06, Deotari Alukhunda Road\nNear Deotari Kali Mandir, Deotari Alukhunda\nBongaigaon, Assam - 783391',email:'hello@clippd.in',gstin:'18CVTPM2138R1ZK',web:'clippd.in',terms:'Returns or exchanges may be requested within 72 hours of delivery, provided the item is unused and in its original packaging.\nApproved refunds are issued to the original payment method within 5-7 business days of us receiving the returned item.\nAll prices shown are inclusive of 3% GST. Free shipping applies on qualifying orders over Rs. 999.\nCOD orders carry an additional, non-refundable Rs. 39 delivery fee. Delivery timelines are estimates, not guarantees.\nFull terms, returns and privacy policies are available at clippd.in.'},banks:[{id:'cash',name:'Cash',cash:1,open:0},{id:'bank',name:'Bank account',open:0}],sb:{url:'',key:'',table:'products',name:'name',sku:'sku',price:'price',stock:'stock',cost:'',extra:''}});
let S=DEF(),view='dash',q='',fs='all',range='all',acct='bank',D=null,X=null,T=null,conn=false,ITEMS=[],msg='';
const $=s=>document.querySelector(s);
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ld(new Date()),ym=d=>d.slice(0,7),sum=(a,f)=>a.reduce((t,e)=>t+f(e),0);
const lines=e=>e.lines||[{item:e.cat||e.desc||'Item',qty:1,rate:e.amt||0,gst:e.gst||0}];
const lt=l=>l.incl?l.qty*l.rate/(1+l.gst/100):l.qty*l.rate,amt=e=>sum(lines(e),lt),tax=e=>sum(lines(e),l=>l.incl?l.qty*l.rate-lt(l):lt(l)*l.gst/100),tot=e=>amt(e)+tax(e)+(+e.ship||0)+(+e.cod||0);
const st=e=>e.cancelled?'Cancelled':e.paid?'Paid':e.due<today()?'Overdue':'Due';
const bname=id=>(S.banks.find(b=>b.id===id)||{}).name||'';
const bal=a=>(+a.open||0)+sum(S.txns.filter(t=>t.acct===a.id),t=>t.type==='in'?t.amt:-t.amt)+sum((S.jv||[]).flatMap(j=>j.lines.filter(l=>l.acct===a.name).map(l=>(+l.dr||0)-(+l.cr||0))),x=>x);
const SBon=()=>S.sb.url&&S.sb.key;
const STATES=[['01','Jammu & Kashmir'],['02','Himachal Pradesh'],['03','Punjab'],['04','Chandigarh'],['05','Uttarakhand'],['06','Haryana'],['07','Delhi'],['08','Rajasthan'],['09','Uttar Pradesh'],['10','Bihar'],['11','Sikkim'],['12','Arunachal Pradesh'],['13','Nagaland'],['14','Manipur'],['15','Mizoram'],['16','Tripura'],['17','Meghalaya'],['18','Assam'],['19','West Bengal'],['20','Jharkhand'],['21','Odisha'],['22','Chhattisgarh'],['23','Madhya Pradesh'],['24','Gujarat'],['26','Dadra & Nagar Haveli and Daman & Diu'],['27','Maharashtra'],['29','Karnataka'],['30','Goa'],['31','Lakshadweep'],['32','Kerala'],['33','Tamil Nadu'],['34','Puducherry'],['35','Andaman & Nicobar Islands'],['36','Telangana'],['37','Andhra Pradesh'],['38','Ladakh']];
const SC=()=>(S.co.gstin||'').slice(0,2)||'18';
const nextNo=t=>{const m=S.entries.filter(e=>e.type===t&&e.no).map(e=>parseInt(e.no.replace(/\D/g,''))||0);return(t==='sale'?'INV-':'BILL-')+String(Math.max(0,...m)+1).padStart(6,'0')};
function fix(){S.entries.forEach(e=>{if(!e.due)e.due=e.date});['sale','expense'].forEach(t=>S.entries.filter(e=>e.type===t&&!e.no).forEach(e=>e.no=nextNo(t)))}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const d=DEF();S={...d,...r,sb:{...d.sb,...r.sb},co:{...d.co,...r.co}};if(!S.banks.length)S.banks=d.banks}}catch(e){}if(S.biz==='My business')S.biz='CLIPPD';fix()}
let dataFileHandle=null, fileWriteBusy=false, fileWritePending=false;
function safeData(){return JSON.stringify({...S,sb:{...S.sb,key:''}},null,2)}
function openHandleDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('accounts-file-storage',1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function rememberFileHandle(h){const db=await openHandleDB();return new Promise((resolve,reject)=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(h,'dataFile');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function recoverFileHandle(){try{const db=await openHandleDB();const h=await new Promise((resolve,reject)=>{const r=db.transaction('handles','readonly').objectStore('handles').get('dataFile');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)});db.close();if(h)dataFileHandle=h}catch(e){}}
async function writeDataFile(){if(!dataFileHandle)return;if(fileWriteBusy){fileWritePending=true;return}fileWriteBusy=true;try{let p=await dataFileHandle.queryPermission({mode:'readwrite'});if(p!=='granted')p=await dataFileHandle.requestPermission({mode:'readwrite'});if(p==='granted'){const w=await dataFileHandle.createWritable();await w.write(safeData());await w.close()}}catch(e){console.warn('File backup update failed:',e)}finally{fileWriteBusy=false;if(fileWritePending){fileWritePending=false;writeDataFile()}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(dataFileHandle)writeDataFile()}catch(e){alert('Could not save in this browser. Download a backup from Settings.')}}
async function chooseDataFile(){try{if(!window.showSaveFilePicker){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([safeData()],{type:'application/json'}));a.download='clippd-accounts-data.json';a.click();alert('Your data file was downloaded. This browser cannot automatically update a file in File Manager; use Download backup after changes.');return}const h=await window.showSaveFilePicker({suggestedName:'clippd-accounts-data.json',types:[{description:'Accounts data backup',accept:{'application/json':['.json']}}]});dataFileHandle=h;await rememberFileHandle(h);await writeDataFile();alert('Data file connected. New changes will be saved to this file when browser permission is available. Keep this file in your File Manager/Downloads.')}catch(e){if(e.name!=='AbortError')alert('Could not connect the data file. Use Download backup instead.')}}
function setPaid(e,p,aid,date){S.txns=S.txns.filter(t=>t.entry!==e.id);e.paid=p;if(p)S.txns.push({id:uid(),date:date||today(),acct:aid,type:e.type==='sale'?'in':'out',amt:tot(e),ref:e.no,note:e.party,entry:e.id})}
function stats(l){const s=l.filter(e=>e.type==='sale'&&!e.cancelled),x=l.filter(e=>e.type==='expense'&&!e.cancelled);return{inc:sum(s,amt),exp:sum(x,amt),og:sum(s,tax),ig:sum(x,tax)}}

const recs=()=>[...S.entries,...S.exps.map(x=>({type:'expense',date:x.date,lines:[{item:x.cat,qty:1,rate:x.amt,gst:x.gst}]}))];
/* ---- website (Supabase) ---- */
async function sbf(path,o={}){const c=S.sb,t=sessionStorage.getItem('sbt')||c.key;
 const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/'+path,{...o,headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=representation'}});
 const x=await r.text();if(!r.ok)throw new Error(x||r.status);return x?JSON.parse(x):[]}
async function loadItems(){if(!SBon())return;try{ITEMS=await sbf(S.sb.table+'?select=*&limit=1000');conn=true}catch(e){conn=false;msg='Could not read website products: '+e.message}
 $('#items').innerHTML=ITEMS.map(r=>`<option value="${esc(r[S.sb.name])}">stock ${r[S.sb.stock]??'?'}</option>`).join('')}
const find=l=>{const c=S.sb,k=String(l.sku||'').toLowerCase();return ITEMS.find(r=>k&&String(r[c.sku]??'').toLowerCase()===k)||ITEMS.find(r=>String(r[c.name]).toLowerCase()===String(l.item).toLowerCase())};

  for(const l of lines(e)){const r=find(l);
   if(e.type==='expense'){
    if(r){const ns=(+r[c.stock]||0)+ +l.qty,b={[c.stock]:ns};if(c.cost)b[c.cost]=l.rate;if(l.sell)b[c.price]=l.sell;await sbf(`${c.table}?id=eq.${r.id}`,{method:'PATCH',body:JSON.stringify(b)});r[c.stock]=ns}

function stockSum(){const c=S.sb,q=r=>+r[c.stock]||0,n=ITEMS.length,u=sum(ITEMS,q),vs=sum(ITEMS,r=>q(r)*(+r[c.price]||0)),vc=c.cost?sum(ITEMS,r=>q(r)*(+r[c.cost]||0)):null,out=ITEMS.filter(r=>q(r)<=0).length,low=ITEMS.filter(r=>q(r)>0&&q(r)<=LOWSTOCK).length;return{n,u,vs,vc,out,low}}

 if(k==='zc')dl('zoho-chart-of-accounts-'+d+'.csv',csv([['Account Name','Account Code','Account Type','Description'],...Object.entries(M).filter(([n,g])=>!P(g)).map(([n,g])=>[n,'',ZT[g],''])]));
 if(k==='zp')dl('zoho-contacts-'+d+'.csv',csv([['Display Name','Contact Type','Email','Phone'],...Object.entries(M).filter(([n,g])=>P(g)).map(([n,g])=>{const e=S.entries.find(x=>pn(x)===n)||{};return[n,g==='Sundry Debtors'?'customer':'vendor',e.email||'',e.phone||'']})]));
 if(k==='zj')dl('zoho-journals-'+d+'.csv',csv([['Journal Date','Journal Number','Reference Number','Notes','Journal Type','Currency Code','Exchange Rate','Account','Description','Contact Name','Debit','Credit'],...V.flatMap((v,i)=>v.ls.map(l=>{const z=zl(l);return[v.date,v.type.slice(0,3).toUpperCase()+'-'+String(i+1).padStart(6,'0'),v.no,v.narr,'both','INR',1,z[0],v.narr,z[1],l.dr||'',l.cr||'']}))]));

const LG=()=>S.co.logo||(document.querySelector('.gate-logo')||{}).src||'';
const fd=s=>s?s.split('-').reverse().join('-'):'';

function presetRange(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),fy=m>=3?y:y-1;
 if(k==='today')return[today(),today()];
 if(k==='month')return[ld(new Date(y,m,1)),ld(new Date(y,m+1,0))];
 if(k==='lastmonth')return[ld(new Date(y,m-1,1)),ld(new Date(y,m,0))];
 if(k==='quarter'){const q=Math.floor(m/3)*3;return[ld(new Date(y,q,1)),ld(new Date(y,q+3,0))]}
 if(k==='fy')return[fy+'-04-01',(fy+1)+'-03-31'];
 if(k==='lastfy')return[(fy-1)+'-04-01',fy+'-03-31'];
 return['',''];}
const rbar=note=>`<div class="rbar"><label>Period<select id="rp">${RP.map(([k,t])=>`<option value="${k}"${k===rp?' selected':''}>${t}</option>`).join('')}</select></label><label>From<input type="date" id="pf" value="${pf}"></label><label>To<input type="date" id="pt" value="${pt}"></label>${note?`<small>${note}</small>`:''}</div>`;
const rangeText=asof=>asof?'As on: '+fd(pt||today()):(!pf&&!pt?'All dates':'Period: '+(pf?fd(pf):'Beginning')+' to '+fd(pt||today()));

function tableData(t){
 const hs=[...t.querySelectorAll('thead th')].map(c=>c.innerText.trim()),al=[],rows=[];
 [...t.querySelectorAll('thead th')].forEach((th,i)=>{if(th.classList.contains('n'))al[i]='r'});
 t.querySelectorAll('tr').forEach(tr=>{if(tr.parentElement.tagName==='THEAD')return;const cells=[...tr.children];if(!cells.length)return;
  if(cells.length===1&&cells[0].colSpan>1){rows.push({sec:1,c:[cells[0].innerText]});return}
  const c=[];cells.forEach(td=>{const i=c.length;let x=td.innerText;if(td.querySelector('[data-open]'))x=x.replace(/\s*Change\s*$/,'');c.push(x);if(td.classList.contains('n'))al[i]='r';for(let k=1;k<td.colSpan;k++)c.push('')});
  rows.push({c,b:tr.parentElement.tagName==='TFOOT'||!!tr.querySelector('b')})});
 let ncol=Math.max(hs.length,...rows.filter(r=>!r.sec).map(r=>r.c.length),1);
 if(hs.length&&!hs[hs.length-1]){hs.pop();rows.forEach(r=>{if(!r.sec)r.c.pop()});ncol--}
 return{headers:hs,rows,al,ncol}}

function pdfTable(o){
 const J=window.jspdf;if(!J||!J.jsPDF){alert('PDF library did not load. Check your internet connection and try again.');return}
 const nc=o.ncol,land=nc>7,PW=land?297:210,PH=land?210:297,M=12,U=PW-M*2,FS=land?7.5:8;
 const doc=new J.jsPDF({unit:'mm',format:'a4',orientation:land?'landscape':'portrait'});
 const cl=v=>String(v==null?'':v).replace(/\u20B9/g,'Rs. ').replace(/[\u2013\u2014]/g,'-').replace(/[^\x00-\xFF]/g,'').replace(/\s+/g,' ').trim();
 const BK=[29,26,23],BR=[160,124,69],MU=[101,93,83],HD=[238,231,217],PL=[248,245,238];
 const wt=[];for(let i=0;i<nc;i++){let m=cl(o.headers[i]).length;o.rows.forEach(r=>{if(!r.sec)m=Math.max(m,cl(r.c[i]).length)});wt.push(Math.min(Math.max(m,7),34))}
 const tw=wt.reduce((a,b)=>a+b,0),W=wt.map(w=>w/tw*U);
 const band=()=>{doc.setFillColor(...BK);doc.rect(0,0,PW,24,'F');doc.setFillColor(...BR);doc.rect(0,24,PW,.8,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(cl(o.company),M,11);doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text(cl(o.title),M,18.5);doc.setFontSize(8);doc.setTextColor(215,204,183);doc.text(cl(o.period),PW-M,11,{align:'right'});doc.text('Generated: '+fd(today()),PW-M,18.5,{align:'right'})};
 let y=30;
 const head=()=>{if(!o.headers.some(h=>cl(h)))return;doc.setFillColor(...HD);doc.rect(M,y,U,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(FS-.5);doc.setTextColor(...MU);let x=M;for(let i=0;i<nc;i++){const t=cl(o.headers[i]).toUpperCase();if(o.al[i]==='r')doc.text(t,x+W[i]-1.5,y+4.6,{align:'right'});else doc.text(t,x+1.5,y+4.6);x+=W[i]}y+=7};
 band();head();let k=0;
 o.rows.forEach(r=>{
  doc.setFont('helvetica',r.b||r.sec?'bold':'normal');doc.setFontSize(FS);
  const cells=r.sec?[doc.splitTextToSize(cl(r.c[0]),U-3)]:r.c.slice(0,nc).map((t,i)=>doc.splitTextToSize(cl(t),W[i]-3));
  const h=Math.max(1,...cells.map(a=>a.length))*FS*.42+3;
  if(y+h>PH-16){doc.addPage();band();y=30;head();doc.setFont('helvetica',r.b||r.sec?'bold':'normal');doc.setFontSize(FS)}
  if(r.sec||(k++%2)){doc.setFillColor(...PL);doc.rect(M,y,U,h,'F')}
  doc.setTextColor(30,26,23);let x=M;
  cells.forEach((ln,i)=>{if(r.sec)doc.text(ln,x+1.5,y+4);else if(o.al[i]==='r')doc.text(ln,x+W[i]-1.5,y+4,{align:'right'});else doc.text(ln,x+1.5,y+4);x+=W[i]});
  doc.setDrawColor(216,204,183);doc.setLineWidth(.15);doc.line(M,y+h,M+U,y+h);y+=h});
 const np=doc.getNumberOfPages();for(let p=1;p<=np;p++){doc.setPage(p);doc.setDrawColor(...BR);doc.setLineWidth(.3);doc.line(M,PH-12,PW-M,PH-12);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MU);doc.text(cl(o.company)+' Accounts',M,PH-7);doc.text('Page '+p+' of '+np,PW-M,PH-7,{align:'right'})}
 doc.save(cl(o.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+today()+'.pdf')}

function exportLedger(fmt){
