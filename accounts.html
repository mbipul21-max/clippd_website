<style>

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{background:#fff;border:1px solid var(--l);border-radius:6px;padding:8px 14px;cursor:pointer;text-align:left}.chip[aria-pressed=true]{border-color:var(--b);box-shadow:0 0 0 1px var(--b)}.top a{text-decoration:none;white-space:nowrap}
dialog{border:0;border-radius:8px;padding:0;width:min(440px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,24,33,.5)}

@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto}.brand,.grp{display:none}.item{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;width:auto}.item[aria-current=true]{border-bottom-color:var(--pk)}.top,.page{padding-left:14px;padding-right:14px}.org{display:block}}
</style></head><body>
<div class="app"><aside id="side"></aside><div>
<div class="top"><span class="org" id="org"></span><input type="search" id="gq" placeholder="Search invoices, bills, items" aria-label="Search"><span class="sp"></span><a class="lnk" href="https://clippd.in" target="_blank" rel="noopener">Open store ↗</a><button class="btn" id="newBtn">+ New</button></div>

<script>
const KEY='accounts.v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF=()=>({biz:'CLIPPD',entries:[],txns:[],exps:[],jv:[],coa:[],co:{name:'CLIPPD',tag:'YOUR EVERYDAY SLAY',addr:'H No 06, Deotari Alukhunda Road\nNear Deotari Kali Mandir, Deotari Alukhunda\nBongaigaon, Assam - 783391',email:'hello@clippd.in',gstin:'18CVTPM2138R1ZK',web:'clippd.in',terms:'Returns or exchanges may be requested within 72 hours of delivery, provided the item is unused and in its original packaging.\nApproved refunds are issued to the original payment method within 5-7 business days of us receiving the returned item.\nAll prices shown are inclusive of 3% GST. Free shipping applies on qualifying orders over Rs. 999.\nCOD orders carry an additional, non-refundable Rs. 39 delivery fee. Delivery timelines are estimates, not guarantees.\nFull terms, returns and privacy policies are available at clippd.in.'},banks:[{id:'cash',name:'Cash',cash:1,open:0},{id:'bank',name:'Bank account',open:0}],sb:{url:'',key:'',table:'products',name:'name',sku:'sku',price:'price',stock:'stock',cost:'',extra:''}});
let S=DEF(),view='dash',q='',fs='all',range='all',acct='bank',D=null,X=null,T=null,conn=false,ITEMS=[],msg='';
const $=s=>document.querySelector(s);
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),ym=d=>d.slice(0,7),sum=(a,f)=>a.reduce((t,e)=>t+f(e),0);
const lines=e=>e.lines||[{item:e.cat||e.desc||'Item',qty:1,rate:e.amt||0,gst:e.gst||0}];
const lt=l=>l.incl?l.qty*l.rate/(1+l.gst/100):l.qty*l.rate,amt=e=>sum(lines(e),lt),tax=e=>sum(lines(e),l=>l.incl?l.qty*l.rate-lt(l):lt(l)*l.gst/100),tot=e=>amt(e)+tax(e)+(+e.ship||0)+(+e.cod||0);
const st=e=>e.cancelled?'Cancelled':e.paid?'Paid':e.due<today()?'Overdue':'Due';
const bname=id=>(S.banks.find(b=>b.id===id)||{}).name||'';
const bal=a=>(+a.open||0)+sum(S.txns.filter(t=>t.acct===a.id),t=>t.type==='in'?t.amt:-t.amt);
const SBon=()=>S.sb.url&&S.sb.key;
const STATES=[['01','Jammu & Kashmir'],['02','Himachal Pradesh'],['03','Punjab'],['04','Chandigarh'],['05','Uttarakhand'],['06','Haryana'],['07','Delhi'],['08','Rajasthan'],['09','Uttar Pradesh'],['10','Bihar'],['11','Sikkim'],['12','Arunachal Pradesh'],['13','Nagaland'],['14','Manipur'],['15','Mizoram'],['16','Tripura'],['17','Meghalaya'],['18','Assam'],['19','West Bengal'],['20','Jharkhand'],['21','Odisha'],['22','Chhattisgarh'],['23','Madhya Pradesh'],['24','Gujarat'],['26','Dadra & Nagar Haveli and Daman & Diu'],['27','Maharashtra'],['29','Karnataka'],['30','Goa'],['31','Lakshadweep'],['32','Kerala'],['33','Tamil Nadu'],['34','Puducherry'],['35','Andaman & Nicobar Islands'],['36','Telangana'],['37','Andhra Pradesh'],['38','Ladakh']];
const SC=()=>(S.co.gstin||'').slice(0,2)||'18';
const nextNo=t=>{const m=S.entries.filter(e=>e.type===t&&e.no).map(e=>parseInt(e.no.replace(/\D/g,''))||0);return(t==='sale'?'INV-':'BILL-')+String(Math.max(0,...m)+1).padStart(6,'0')};
function fix(){S.entries.forEach(e=>{if(!e.due)e.due=e.date});['sale','expense'].forEach(t=>S.entries.filter(e=>e.type===t&&!e.no).forEach(e=>e.no=nextNo(t)))}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const d=DEF();S={...d,...r,sb:{...d.sb,...r.sb},co:{...d.co,...r.co}};if(!S.banks.length)S.banks=d.banks}}catch(e){}if(S.biz==='My business')S.biz='CLIPPD';fix()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save in this browser. Download a backup from Settings.')}}
function setPaid(e,p,aid,date){S.txns=S.txns.filter(t=>t.entry!==e.id);e.paid=p;if(p)S.txns.push({id:uid(),date:date||today(),acct:aid,type:e.type==='sale'?'in':'out',amt:tot(e),ref:e.no,note:e.party,entry:e.id})}
function stats(l){const s=l.filter(e=>e.type==='sale'&&!e.cancelled),x=l.filter(e=>e.type==='expense'&&!e.cancelled);return{inc:sum(s,amt),exp:sum(x,amt),og:sum(s,tax),ig:sum(x,tax)}}

const recs=()=>[...S.entries,...S.exps.map(x=>({type:'expense',date:x.date,lines:[{item:x.cat,qty:1,rate:x.amt,gst:x.gst}]}))];
/* ---- website (Supabase) ---- */
async function sbf(path,o={}){const c=S.sb,t=sessionStorage.getItem('sbt')||c.key;
 const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/'+path,{...o,headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'return=representation'}});
 const x=await r.text();if(!r.ok)throw new Error(x||r.status);return x?JSON.parse(x):[]}
async function loadItems(){if(!SBon())return;try{ITEMS=await sbf(S.sb.table+'?select=*&limit=1000');conn=true}catch(e){conn=false;msg='Could not read website products: '+e.message}
 $('#items').innerHTML=ITEMS.map(r=>`<option value="${esc(r[S.sb.name])}">stock ${r[S.sb.stock]??'?'}</option>`).join('')}
const find=l=>{const c=S.sb,k=String(l.sku||'').toLowerCase();return ITEMS.find(r=>k&&String(r[c.sku]??'').toLowerCase()===k)||ITEMS.find(r=>String(r[c.name]).toLowerCase()===String(l.item).toLowerCase())};
async function syncEntry(e){const c=S.sb;let n=0;
 try{await loadItems();let ex={};try{ex=JSON.parse(c.extra||'{}')}catch(_){}
  for(const l of lines(e)){const r=find(l);
   if(e.type==='expense'){
    if(r){const ns=(+r[c.stock]||0)+ +l.qty,b={[c.stock]:ns};if(c.cost)b[c.cost]=l.rate;if(l.sell)b[c.price]=l.sell;await sbf(`${c.table}?id=eq.${r.id}`,{method:'PATCH',body:JSON.stringify(b)});r[c.stock]=ns}
    else{const b={...ex,[c.name]:l.item,[c.price]:l.sell||l.rate,[c.stock]:+l.qty};if(c.sku&&l.sku)b[c.sku]=l.sku;if(c.cost)b[c.cost]=l.rate;const x=await sbf(c.table,{method:'POST',body:JSON.stringify(b)});ITEMS.push(...x)}n++}
   else if(r){const ns=Math.max(0,(+r[c.stock]||0)-l.qty);await sbf(`${c.table}?id=eq.${r.id}`,{method:'PATCH',body:JSON.stringify({[c.stock]:ns})});r[c.stock]=ns;n++}}
  e.synced=true;save();msg=`Website updated: ${n} item${n==1?'':'s'} ${e.type==='sale'?'deducted from stock':'added or restocked'}.`;await loadItems()}
 catch(err){msg='Saved here, but the website sync failed: '+err.message+' Use "Sync to website" on the row to retry.'}}


/* ---- website orders -> invoices ---- */
let WO=[];
const SKIP_ST=['cancelled','pending_payment'],isCODo=o=>/cod|cash/i.test(o.payment_method||'');
const importable=o=>!SKIP_ST.includes(o.status)&&!S.entries.some(e=>e.oid===o.id);
const istDate=v=>new Date(v).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
const nm=n=>String(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z ]/g,'').trim();
const stCode=n=>(STATES.find(x=>nm(x[1])===nm(n))||[''])[0];
async function loadOrders(){if(!SBon())return;
 try{WO=await sbf('orders?select=*&order=created_at.desc&limit=500');let n=0;
  WO.forEach(o=>{const e=S.entries.find(x=>x.oid===o.id);if(e&&!e.paid&&!e.cancelled&&o.status==='delivered'){setPaid(e,true,'bank',istDate(o.created_at));n++}});
  if(n){save();msg=n+' COD order'+(n==1?'':'s')+' marked paid because the website shows them as delivered.'}}
 catch(e){WO=[];msg='Could not read website orders: '+e.message+' If orders are admin-only, sign in under Settings first.'}}
async function importOrders(list){list=list.filter(Boolean);if(!list.length)return;let n=0,bad=[],odd=[];
 try{const by={};
  for(let i=0;i<list.length;i+=40){const ids=list.slice(i,i+40).map(o=>'"'+o.id+'"').join(',');
   (await sbf('order_items?select=order_id,product_id,product_name,price,qty&order_id=in.('+encodeURIComponent('('+ids+')')+')')).forEach(r=>(by[r.order_id]=by[r.order_id]||[]).push(r))}
  const hs=S.entries.flatMap(lines).reverse();
  for(const o of list){const it=by[o.id]||[];if(!it.length){bad.push(o.id);continue}
   const cod=isCODo(o),cc=cod&&(+o.subtotal||0)<999?39:0,ship=Math.max(0,(+o.shipping||0)-cc),date=istDate(o.created_at),
   ls=it.map(r=>{const base=String(r.product_name).replace(/ \([^)]*\)$/,'').toLowerCase(),p=ITEMS.find(x=>String(x.id)===String(r.product_id)),h=hs.find(m=>m.hsn&&[String(r.product_name).toLowerCase(),base].includes(String(m.item).toLowerCase()));
    return{item:r.product_name,sku:p?(p[S.sb.sku]||''):'',qty:+r.qty||1,rate:+r.price||0,gst:3,incl:1,hsn:h?h.hsn:''}}),
   e={id:uid(),type:'sale',no:nextNo('sale'),party:o.customer_name||'Website customer',date,due:date,lines:ls,desc:'Website order '+o.id,site:false,synced:true,oid:o.id,email:o.email||'',
    addr:[o.address,o.city,o.state].filter(Boolean).join(', ')+(o.pincode?' - '+o.pincode:''),phone:o.phone||'',
    pm:['COD','UPI','Card','Bank transfer','Cash'].find(m=>m.toLowerCase()===String(o.payment_method).toLowerCase())||'UPI',ship,cod:cc,pos:stCode(o.state)||SC()};
   S.entries.push(e);setPaid(e,!cod||o.status==='delivered','bank',date);n++;
   if(Math.abs(tot(e)-(+o.total||0))>1)odd.push(o.id)}
  save();msg=`Imported ${n} website order${n==1?'':'s'} as invoices (stock was not changed).`+(bad.length?` Skipped, no items found: ${bad.join(', ')}.`:'')+(odd.length?` Check totals on: ${odd.join(', ')}.`:'')}
 catch(err){save();msg='Order import failed: '+err.message}}
function wo(){const rows=WO.filter(o=>!q||(o.id+o.customer_name+o.phone+(o.email||'')).toLowerCase().includes(q.toLowerCase())),nw=rows.filter(importable);
 const act=o=>{const e=S.entries.find(x=>x.oid===o.id);return e?`<button class="lnk" data-edit="${e.id}">${esc(e.no)}</button>`:SKIP_ST.includes(o.status)?'<small>Not imported (unpaid or cancelled)</small>':`<button class="lnk" data-imp="${esc(o.id)}">Import</button>`};
 return `<div class="ph"><h1>Website orders</h1><div class="tools"><button class="btn g" id="refWo">Refresh</button>${nw.length?`<button class="btn" id="impAll">Import ${nw.length} new</button>`:''}</div></div>`+
 (!SBon()?'<div class="empty">Connect your website database in Settings to see orders here.</div>':rows.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Order ID</th><th>Customer</th><th>Phone</th><th>Email</th><th>City, State</th><th>Payment</th><th>Status</th><th class="n">Total</th><th>Invoice</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${istDate(o.created_at)}</td><td>${esc(o.id)}</td><td>${esc(o.customer_name)}</td><td>${esc(o.phone)}</td><td>${esc(o.email)}</td><td>${esc([o.city,o.state].filter(Boolean).join(', '))}</td><td>${esc(o.payment_method)}</td><td>${esc(o.status)}</td><td class="n">${inr(o.total)}</td><td>${act(o)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No website orders found. If you have orders, sign in under Settings (orders are usually admin-only).</div>')}
/* ---- invoice PDF ---- */
function makePdf(e){const J=window.jspdf;if(!J){msg='The PDF library could not load. Check your internet connection and try again.';return false}
 const doc=new J.jsPDF({unit:'mm',format:'a4'}),c=S.co,W=[117,43,59],GD=[161,125,69],G=[85,85,85],K=[30,30,30],rs=n=>'Rs. '+(+n).toFixed(2),L=lines(e),cl=t=>String(t||'').replace(/[\u2013\u2014]/g,'-');
 const pc=e.pos||SC(),intra=pc===SC(),sn=(STATES.find(x=>x[0]===pc)||['',''])[1],unit=l=>l.incl?l.rate:l.rate*(1+l.gst/100),ltx=l=>l.incl?l.qty*l.rate-lt(l):lt(l)*l.gst/100;
 const fill=(col,x,y,w,h,rd)=>{doc.setFillColor(...col);rd?doc.roundedRect(x,y,w,h,rd,rd,'F'):doc.rect(x,y,w,h,'F')};
 const T=(s,x,y,f,st,sz,col,o)=>{doc.setFont(f,st);doc.setFontSize(sz);doc.setTextColor(...col);doc.text(cl(s),x,y,o)};
 const dt=new Date(e.date+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
 fill(W,0,0,210,36.5);fill(GD,0,36.5,210,1);
 if(c.logo){const lh=17,lw=Math.min(60,lh*((c.lw/c.lh)||1));fill([255,255,255],15.5,5.5,lw+6,lh+4,2);try{doc.addImage(c.logo,'PNG',18.5,7.5,lw,lh)}catch(_){T(c.name,15.5,17,'times','normal',32,[255,255,255])}T(c.tag,16,31.5,'courier','normal',7,[201,160,168],{charSpace:2.8})}else{T(c.name,15.5,17,'times','normal',32,[255,255,255]);T(c.tag,16,23.5,'courier','normal',7,[201,160,168],{charSpace:2.8})}
 T('TAX INVOICE',194.5,15.5,'times','normal',24,[255,255,255],{align:'right'});
 [['INVOICE NO',e.no],['ORDER ID',e.oid||'-'],['DATE',dt]].forEach(([k,v],i)=>{T(k,158,21.5+i*4.7,'courier','normal',7,[201,160,168],{align:'right'});T(v,194.5,21.5+i*4.7,'courier','normal',7.5,[255,255,255],{align:'right'})});
 T('BILLED TO',15.5,50,'courier','normal',6.5,GD);T('SOLD BY',108.5,50,'courier','normal',6.5,GD);

const trs=(rows,c=2)=>rows.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="n"':''}>${x}</td>`).join('')}</tr>`).join('');
function plv(){const B=tbal(pf,pt).filter(x=>'IX'.includes(GT[x.g])),nt=x=>GT[x.g]==='I'?x.cr-x.dr:x.dr-x.cr,
 sec=(gs,t)=>{const r=B.filter(x=>gs.includes(x.g)&&r2(nt(x))),s=sum(r,nt);return[`<tr><td colspan="2"><b>${t}</b></td></tr>`+trs(r.map(x=>['&nbsp;&nbsp;'+esc(x.l),inr(nt(x))]))+`<tr><td><i>Total ${t}</i></td><td class="n"><i>${inr(s)}</i></td></tr>`,s]},
 [a,sa]=sec(['Sales Accounts'],'Sales'),[b,sb]=sec(['Purchase Accounts','Direct Expenses'],'Cost of goods sold'),[c,sc]=sec(['Indirect Incomes'],'Other income'),[d,sd]=sec(['Indirect Expenses'],'Operating expenses'),gp=sa-sb,np=gp+sc-sd;
 return `<div class="ph"><h1>Profit and loss</h1></div>${bar(1)}<div class="tbl"><table><tbody>${a}${b}<tr><td><b>Gross profit</b></td><td class="n"><b>${inr(gp)}</b></td></tr>${c}${d}<tr><td><b>Net ${np<0?'loss':'profit'}</b></td><td class="n ${np<0?'loss':'gain'}"><b>${inr(np)}</b></td></tr></tbody></table></div><small>Purchases are expensed as bought. For closing stock, post a journal: debit Inventory, credit Purchases.</small>`}
function bsv(){const B=tbal('',pt),np=sum(B.filter(x=>GT[x.g]==='I'),x=>x.cr-x.dr)-sum(B.filter(x=>GT[x.g]==='X'),x=>x.dr-x.cr),
 side=(t,s)=>{const m={};B.filter(x=>GT[x.g]===t&&r2(x.dr-x.cr)).forEach(x=>{const k=/^Sundry/.test(x.g)?x.g:x.l;m[k]=(m[k]||0)+s*(x.dr-x.cr)});return Object.entries(m)},
 A=side('A',1),L=side('L',-1),E=[...side('E',-1),['Net profit to date',np]],ta=sum(A,x=>x[1]),tl=sum(L,x=>x[1])+sum(E,x=>x[1]),
 blk=(t,r,s)=>`<tr><td colspan="2"><b>${t}</b></td></tr>`+trs(r.map(x=>['&nbsp;&nbsp;'+esc(x[0]),inr(x[1])]))+`<tr><td><b>Total ${t}</b></td><td class="n"><b>${inr(s)}</b></td></tr>`;
 return `<div class="ph"><h1>Balance sheet</h1></div>${bar(0)}<div class="tbl"><table><tbody>${blk('Assets',A,ta)}${blk('Liabilities',L,sum(L,x=>x[1]))}${blk('Equity',E,sum(E,x=>x[1]))}<tr><td><b>Liabilities + equity</b></td><td class="n"><b>${inr(tl)}</b></td></tr></tbody></table></div>${r2(ta-tl)?`<div class="msg">Assets and liabilities differ by ${inr(ta-tl)}. Check your journals.</div>`:''}`}
function tb(){const B=tbal('',pt).filter(x=>r2(x.dr-x.cr)).sort((a,b)=>a.g.localeCompare(b.g)||a.l.localeCompare(b.l));let d=0,c=0;
 return `<div class="ph"><h1>Trial balance</h1></div>${bar(0)}<div class="tbl"><table><thead><tr><th>Ledger</th><th>Group</th><th class="n">Debit</th><th class="n">Credit</th></tr></thead><tbody>${B.map(x=>{const n=x.dr-x.cr;n>0?d+=n:c-=n;return `<tr><td>${esc(x.l)}</td><td>${esc(x.g)}</td><td class="n">${n>0?inr(n):''}</td><td class="n">${n<0?inr(-n):''}</td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="n"><b>${inr(d)}</b></td><td class="n"><b>${inr(c)}</b></td></tr></tfoot></table></div>`}
function led(){const B=tbal('',pt),k=LK==='c'?'Sundry Debtors':LK==='v'?'Sundry Creditors':0,chip=(x,t)=>`<button class="chip" data-x="lk" data-v="${x}" aria-pressed="${LK===x}">${t}</button>`;
 let h=`<div class="ph"><h1>Ledgers</h1><button class="btn g" data-x="lg">Add ledger</button></div><div class="chips">${chip('c','Customers')}${chip('v','Vendors')}${chip('a','All ledgers')}</div>`;
 if(LN){let b=0;const rows=vouch().flatMap(v=>v.ls.filter(l=>l.l===LN&&v.date<=pt).map(l=>({v,l})));
  return h+`<div class="ph"><h2>${esc(LN)}</h2><button class="btn g" data-x="lb">Back</button></div><div class="tbl"><table><thead><tr><th>Date</th><th>Type</th><th>No</th><th>Narration</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr></thead><tbody>${rows.map(({v,l})=>{b+=l.dr-l.cr;return `<tr><td>${v.date}</td><td>${v.type}</td><td>${esc(v.no)}</td><td>${esc(v.narr)}</td><td class="n">${l.dr?inr(l.dr):''}</td><td class="n">${l.cr?inr(l.cr):''}</td><td class="n">${sgn(b)}</td></tr>`}).join('')||'<tr><td colspan="7">No entries.</td></tr>'}</tbody></table></div>`}
 return h+bar(0)+`<div class="tbl"><table><thead><tr><th>Ledger</th><th>Group</th><th class="n">Closing balance</th></tr></thead><tbody>${B.filter(x=>k?x.g===k:1).sort((a,b)=>a.l.localeCompare(b.l)).map(x=>`<tr><td><button class="lnk" data-x="ln" data-v="${esc(x.l)}">${esc(x.l)}</button></td><td>${esc(x.g)}</td><td class="n">${sgn(x.dr-x.cr)}</td></tr>`).join('')||'<tr><td colspan="3">Nothing here yet.</td></tr>'}</tbody></table></div>`}
function jv(){const a=(S.jv||[]).slice().sort((x,y)=>y.date.localeCompare(x.date));
 return `<div class="ph"><h1>Journal (adjustments)</h1><button class="btn" data-x="jn">+ New journal</button></div><div class="tbl"><table><thead><tr><th>Date</th><th>No</th><th>Narration</th><th>Entries</th><th class="n">Amount</th><th></th></tr></thead><tbody>${a.map(j=>`<tr><td>${j.date}</td><td>${esc(j.no)}</td><td>${esc(j.narr)}</td><td>${j.lines.map(l=>(+l.dr?'Dr ':'Cr ')+esc(l.acct)).join(', ')}</td><td class="n">${inr(sum(j.lines,l=>+l.dr||0))}</td><td><button class="lnk" data-x="je" data-v="${j.id}">Edit</button> <button class="lnk" data-x="jd" data-v="${j.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No journals yet. Use them for closing stock, depreciation, accruals and corrections.</td></tr>'}</tbody></table></div>`}
const jdif=()=>r2(sum(J.lines,l=>+l.dr||0)-sum(J.lines,l=>+l.cr||0));
function jform(){const M=masters(),n=Object.keys(M).sort();
 return `<div class="ph"><h1>${J.isNew?'New':'Edit'} journal</h1><button class="btn g" data-x="lg">Add ledger</button></div><datalist id="lgr">${n.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="fg"><label>Date<input type="date" data-j="date" value="${J.date}"></label><label>Journal no<input data-j="no" value="${esc(J.no)}"></label><label>Narration<input data-j="narr" value="${esc(J.narr)}"></label></div>
 <div class="tbl"><table><thead><tr><th>Ledger</th><th class="n">Debit</th><th class="n">Credit</th><th></th></tr></thead><tbody>${J.lines.map((l,i)=>`<tr><td><input list="lgr" data-i="${i}" data-f="acct" value="${esc(l.acct)}"></td><td><input type="number" step="0.01" data-i="${i}" data-f="dr" value="${l.dr}"></td><td><input type="number" step="0.01" data-i="${i}" data-f="cr" value="${l.cr}"></td><td><button class="lnk" data-x="jx" data-v="${i}">Remove</button></td></tr>`).join('')}</tbody></table></div>
 <div class="tools"><button class="btn g" data-x="jl">+ Add line</button><span id="jdf"></span><span class="sp"></span><button class="btn" data-x="js">Save journal</button><button class="btn g" data-x="jc">Cancel</button></div>`}
function openJ(id){const j=(S.jv||[]).find(x=>x.id===id);J=j?{...JSON.parse(JSON.stringify(j)),isNew:false}:{id:uid(),date:today(),no:'JV-'+String((S.jv||[]).length+1).padStart(6,'0'),narr:'',lines:[{acct:'',dr:'',cr:''},{acct:'',dr:'',cr:''}],isNew:true};view='jform';render()}
function saveJ(){const M=masters(),ls=J.lines.filter(l=>l.acct.trim()&&(+l.dr||+l.cr)).map(l=>({acct:l.acct.trim(),dr:r2(l.dr),cr:r2(l.cr)}));
 if(ls.length<2||jdif()||!sum(ls,l=>l.dr)){alert('Add at least two lines, and make total debit equal total credit.');return}
 const bad=ls.find(l=>!M[l.acct]);if(bad){alert('Ledger "'+bad.acct+'" does not exist. Use Add ledger first.');return}
 const j={id:J.id,date:J.date,no:J.no,narr:J.narr,lines:ls};S.jv=S.jv||[];const i=S.jv.findIndex(x=>x.id===j.id);i>=0?S.jv[i]=j:S.jv.push(j);save();J=null;view='jv';render()}
function addLg(){const n=(prompt('New ledger name')||'').trim();if(!n)return;const gs=Object.keys(GT),g=gs[(+prompt('Group number:\n'+gs.map((x,i)=>(i+1)+'. '+x).join('\n'))||0)-1];if(!g){alert('Choose a valid group number.');return}(S.coa=S.coa||[]).push({n,g});save();render()}
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m||'text/csv'}));a.download=n;a.click()};
const csv=rows=>'\ufeff'+rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
const tx=(rn,b)=>`<?xml version="1.0" encoding="UTF-8"?><ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>${rn}</REPORTNAME></REQUESTDESC><REQUESTDATA>${b}</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>`;
function xport(k){const M=masters(),V=vouch(),d=today(),P=(g)=>/^Sundry/.test(g),zl=l=>[l.g==='Sundry Debtors'?'Accounts Receivable':l.g==='Sundry Creditors'?'Accounts Payable':l.l,P(l.g)?l.l:''];
 if(k==='tm')dl('tally-masters-'+d+'.xml',tx('All Masters',Object.entries(M).map(([n,g])=>`<TALLYMESSAGE xmlns:UDF="TallyUDF"><LEDGER NAME="${esc(n)}" ACTION="Create"><NAME>${esc(n)}</NAME><PARENT>${esc(g)}</PARENT></LEDGER></TALLYMESSAGE>`).join('')),'application/xml');
 if(k==='tv')dl('tally-vouchers-'+d+'.xml',tx('Vouchers',V.map((v,i)=>`<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="${v.type}" ACTION="Create"><DATE>${v.date.replace(/-/g,'')}</DATE><VOUCHERTYPENAME>${v.type}</VOUCHERTYPENAME><VOUCHERNUMBER>${esc(v.no||i+1)}</VOUCHERNUMBER><NARRATION>${esc(v.narr)}</NARRATION>${v.ls.map(l=>`<ALLLEDGERENTRIES.LIST><LEDGERNAME>${esc(l.l)}</LEDGERNAME><ISDEEMEDPOSITIVE>${l.dr?'Yes':'No'}</ISDEEMEDPOSITIVE><AMOUNT>${l.dr?-l.dr:l.cr}</AMOUNT></ALLLEDGERENTRIES.LIST>`).join('')}</VOUCHER></TALLYMESSAGE>`).join('')),'application/xml');
 if(k==='zc')dl('zoho-chart-of-accounts-'+d+'.csv',csv([['Account Name','Account Code','Account Type','Description'],...Object.entries(M).filter(([n,g])=>!P(g)).map(([n,g])=>[n,'',ZT[g],''])]));
 if(k==='zp')dl('zoho-contacts-'+d+'.csv',csv([['Display Name','Contact Type','Email','Phone'],...Object.entries(M).filter(([n,g])=>P(g)).map(([n,g])=>{const e=S.entries.find(x=>pn(x)===n)||{};return[n,g==='Sundry Debtors'?'customer':'vendor',e.email||'',e.phone||'']})]));
 if(k==='zj')dl('zoho-journals-'+d+'.csv',csv([['Journal Date','Journal Number','Reference Number','Notes','Journal Type','Currency Code','Exchange Rate','Account','Description','Contact Name','Debit','Credit'],...V.flatMap((v,i)=>v.ls.map(l=>{const z=zl(l);return[v.date,v.type.slice(0,3).toUpperCase()+'-'+String(i+1).padStart(6,'0'),v.no,v.narr,'both','INR',1,z[0],v.narr,z[1],l.dr||'',l.cr||'']}))]));
 if(k==='db')dl('daybook-'+d+'.csv',csv([['Date','Voucher Type','Voucher No','Ledger','Group','Debit','Credit','Narration'],...V.flatMap(v=>v.ls.map(l=>[v.date,v.type,v.no,l.l,l.g,l.dr||'',l.cr||'',v.narr]))]))}
function xp(){const b=(k,t,s)=>`<tr><td><b>${t}</b><br><small>${s}</small></td><td><button class="btn g" data-x="ex" data-v="${k}">Download</button></td></tr>`;
 return `<div class="ph"><h1>Export for Tally and Zoho Books</h1></div><div class="tbl"><table><tbody>${b('tm','Tally: ledger masters (XML)','Import first: Tally Prime, Import Data, Masters.')+b('tv','Tally: all vouchers (XML)','Import second. Sales, purchases, receipts, payments, contra and journals.')+b('zc','Zoho Books: chart of accounts (CSV)','Settings, Import, Chart of Accounts. Customers and vendors are in the contacts file.')+b('zp','Zoho Books: customers and vendors (CSV)','Import contacts before the journals.')+b('zj','Zoho Books: journals (CSV)','Every voucher as a manual journal, with the contact on receivable and payable lines.')+b('db','Day book (CSV)','Plain debit and credit lines. Opens in Excel and works with most software.')}</tbody></table></div><small>For a full copy of your data, use Settings, Download backup. Everything is saved in this browser only.</small>`}

$('#view').addEventListener('click',e=>{const t=e.target.closest('[data-x]');if(!t)return;const k=t.dataset.x,v=t.dataset.v;
 if(k==='logoDel'){delete S.co.logo;delete S.co.lw;delete S.co.lh;save()}else if(k==='lk'){LK=v;LN=null}else if(k==='ln')LN=v;else if(k==='lb')LN=null;else if(k==='lg'){addLg();return}
 else if(k==='jn')return openJ();else if(k==='je')return openJ(v);
 else if(k==='jd'){if(confirm('Delete this journal?')){S.jv=S.jv.filter(x=>x.id!==v);save()}}
 else if(k==='jl')J.lines.push({acct:'',dr:'',cr:''});else if(k==='jx'){if(J.lines.length>2)J.lines.splice(+v,1)}
 else if(k==='jc'){J=null;view='jv'}else if(k==='js')return saveJ();else if(k==='ex'){xport(v);return}
 render()});
$('#view').addEventListener('input',e=>{const t=e.target;if(!J||view!=='jform')return;if(t.dataset.j)J[t.dataset.j]=t.value;else if(t.dataset.f){J.lines[+t.dataset.i][t.dataset.f]=t.value;const d=jdif();$('#jdf').textContent=d?'Difference '+inr(Math.abs(d))+(d>0?' (debit higher)':' (credit higher)'):'Balanced'}});
$('#view').addEventListener('change',e=>{const t=e.target;if(t.id==='logoFile'&&t.files[0]){const im=new Image,u=URL.createObjectURL(t.files[0]);im.onload=()=>{const k=Math.min(1,400/im.width,200/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.co.logo=c.toDataURL('image/png');S.co.lw=c.width;S.co.lh=c.height;save();msg='Logo saved.';render()};im.onerror=()=>alert('Could not read that image.');im.src=u;return}if(t.id==='pf'||t.id==='pt'){t.id==='pf'?pf=t.value:pt=t.value;render()}});
load();render();loadItems().then(render);
</script></body></html>
