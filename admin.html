<style>
  :root{
    --ivory:#F8F5EE;
    --ivory-deep:#EEE7D9;
    --card:#FFFDFC;
    --charcoal:#1D1A17;
    --charcoal-soft:#655D53;
    --burgundy:#762B3B;
    --brass:#A07C45;
    --sage:#5B7A5B;
    --brick:#8C4A3E;
    --line:#D8CCB7;
    --shadow:0 22px 55px -28px rgba(29,26,23,.30);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--ivory);
    color:var(--charcoal);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces', serif; }
  .mono{ font-family:'Space Mono', monospace; letter-spacing:0.02em; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  input,select,textarea{ font-family:inherit; }

  .eyebrow{
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--burgundy);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 20px; border-radius:8px; font-weight:600; font-size:14px;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn-primary{ background:var(--charcoal); color:var(--ivory); }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 12px 26px -14px rgba(29,26,23,.55); }
  .btn-primary:disabled{ opacity:.55; cursor:default; transform:none; box-shadow:none; }
  .btn-outline{ background:transparent; color:var(--charcoal); border:1px solid var(--line); }
  .btn-outline:hover{ border-color:var(--charcoal); }

  /* ---------- Sign-in gate ---------- */
  #gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .gate-card{
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:36px 32px; box-shadow:var(--shadow);
  }
  .gate-logo{
    display:block; width:72px; height:auto; margin-bottom:14px;
  }
  .gate-card h1{ font-size:26px; font-weight:600; margin-top:8px; }
  .gate-card p{ color:var(--charcoal-soft); font-size:14px; margin-top:8px; line-height:1.5; }
  .field{ margin-top:20px; }
  .field label{ display:block; font-size:12px; color:var(--charcoal-soft); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
    background:var(--ivory); font-size:14px; color:var(--charcoal);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--brass); outline-offset:-2px; }
  .gate-error{ color:var(--brick); font-size:13px; margin-top:14px; }

  /* ---------- Dashboard shell ---------- */
  #dash{ display:none; }
  header.top{
    position:sticky; top:0; z-index:10; background:var(--ivory);
    border-bottom:1px solid var(--line); padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-logo{ height:40px; width:auto; display:block; }
  .brand .sep{ color:var(--line); }
  .brand .section{ font-size:14px; color:var(--charcoal-soft); }
  .who{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--charcoal-soft); }

  main{ padding:24px 28px 80px; max-width:1180px; margin:0 auto; }

  .filters{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;
  }
  .tab{
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;
    border:1px solid var(--line); color:var(--charcoal-soft); white-space:nowrap;
  }
  .tab.active{ background:var(--charcoal); color:var(--ivory); border-color:var(--charcoal); }
  .search{
    margin-left:auto; padding:9px 14px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); font-size:13px; min-width:220px;
  }

  table{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--charcoal-soft); font-weight:600; padding:12px 16px; border-bottom:1px solid var(--line);
  }
  tbody tr{ cursor:pointer; border-bottom:1px solid var(--line); }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--ivory-deep); }
  tbody td{ padding:14px 16px; font-size:14px; }
  td.oid{ font-weight:700; color:var(--burgundy); }
  .status-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .empty{ text-align:center; padding:60px 20px; color:var(--charcoal-soft); }

  /* mobile: cards instead of a table */
  .order-cards{ display:none; }
  @media (max-width:760px){
    table{ display:none; }
    .order-cards{ display:block; }
    .order-card{
      background:var(--card); border:1px solid var(--line); border-radius:10px;
      padding:14px 16px; margin-bottom:10px;
    }
    .order-card .row1{ display:flex; justify-content:space-between; font-weight:700; color:var(--burgundy); }
    .order-card .row2{ display:flex; justify-content:space-between; font-size:12px; color:var(--charcoal-soft); margin-top:6px; }
    .search{ margin-left:0; width:100%; }
    main{ padding:18px 16px 60px; }
    header.top{ padding:14px 16px; }
  }

  /* ---------- Detail drawer ---------- */
  #scrim{
    position:fixed; inset:0; background:rgba(29,26,23,.4); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:20;
  }
  #scrim.open{ opacity:1; pointer-events:auto; }
  #drawer{
    position:fixed; top:0; right:0; height:100%; width:min(440px, 100vw);
    background:var(--card); box-shadow:-24px 0 60px -30px rgba(29,26,23,.5);
    transform:translateX(100%); transition:transform .3s ease; z-index:21;
    overflow-y:auto; padding:30px 28px;
  }
  #drawer.open{ transform:translateX(0); }
  #drawer .close{ position:absolute; top:22px; right:22px; }
  .drawer-section{ margin-top:24px; }
  .drawer-section .label{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--charcoal-soft); font-weight:600; }
  .item-row{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .item-row:last-child{ border-bottom:none; }
  .totals-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--charcoal-soft); margin-top:6px; }
  .totals-row.grand{ color:var(--charcoal); font-weight:700; font-size:15px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .addr{ font-size:14px; line-height:1.6; margin-top:6px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--charcoal); color:var(--ivory); padding:12px 22px; border-radius:8px;
    font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:40;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

  <main>
    <div class="filters" id="filterTabs"></div>

        <tr><th>Order</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th></tr>

<div id="scrim" onclick="closeDrawer()"></div>
<div id="drawer">
  <button class="close btn-outline" style="padding:8px 10px; border-radius:8px;" onclick="closeDrawer()">✕</button>
  <div id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* Same project as the main site — anon key is safe to expose;
     access is gated by RLS policies (see 01_admin_setup.sql). */
  const SUPABASE_URL = 'https://tghmxutqpbxrtrlavmjx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_lr4xdh4MJQQLUA-ZTc4bfQ_I95yCHor';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let gateEmail = '';
  let orders = [];
  let activeFilter = 'all';
  let searchTerm = '';
  let selectedOrderId = null;
  let selectedOrderItems = [];

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function showGateError(msg){
    const el = document.getElementById('gateError');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  /* ---------- Sign-in (email OTP, existing accounts only) ---------- */
  async function sendCode(e){
    e.preventDefault();
    showGateError('');
    gateEmail = document.getElementById('gateEmail').value.trim();
    if(!gateEmail) return false;
    // shouldCreateUser:false — this page never creates new accounts,
    // it only lets an EXISTING account (that you've flagged is_admin
    // in the profiles table) sign in.
    const { error } = await sb.auth.signInWithOtp({
      email: gateEmail,
      options: { shouldCreateUser: false }
    });
    if(error){
      showGateError("Couldn't send a code to that address. Make sure it's a registered account.");
      console.error(error);
      return false;
    }
    document.getElementById('gateBody').innerHTML = `
      <p class="pdesc" style="margin-top:16px; font-size:14px; color:var(--charcoal-soft);">
        Code sent to <strong>${gateEmail}</strong>.
      </p>
      <form class="field" onsubmit="return verifyCode(event)">
        <label>Verification Code</label>
        <input type="text" id="gateOtp" placeholder="123456" inputmode="numeric" maxlength="8" required autofocus>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Verify & Sign In</button>
      </form>
    `;
    return false;
  }
  async function verifyCode(e){
    e.preventDefault();
    showGateError('');
    const token = document.getElementById('gateOtp').value.trim();
    const { error } = await sb.auth.verifyOtp({ email: gateEmail, token, type: 'email' });
    if(error){
      showGateError("That code didn't work — check it and try again.");
      console.error(error);
      return false;
    }
    await checkAdminAndEnter();
    return false;
  }
  async function checkAdminAndEnter(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session?.user){ return; }
    const { data: profile, error } = await sb.from('profiles').select('is_admin, email').eq('id', session.user.id).maybeSingle();
    if(error || !profile?.is_admin){
      showGateError("This account isn't authorized for the admin dashboard.");
      await sb.auth.signOut();
      return;
    }
    document.getElementById('whoEmail').textContent = profile.email;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    await loadOrders();
  }
  async function adminSignOut(){
    await sb.auth.signOut();
    orders = [];
    document.getElementById('dash').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateBody').innerHTML = `
      <form class="field" id="emailForm" onsubmit="return sendCode(event)">
        <label>Email</label>
        <input type="email" id="gateEmail" placeholder="you@email.com" required>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Send Code</button>
      </form>
    `;
    showGateError('');
  }

  // Resume a session on page refresh without re-entering a code.
  sb.auth.onAuthStateChange(async (_event, session) => {
    if(session?.user && document.getElementById('dash').style.display !== 'block'){
      await checkAdminAndEnter();
    }
  });

  /* ---------- Orders ---------- */
  const STATUS_META = {
    placed:            { label: 'Placed',                color: 'var(--brass)' },
    pending_payment:   { label: 'Payment Pending',        color: 'var(--brass)' },
    processing:        { label: 'Processing',             color: 'var(--charcoal-soft)' },
    shipped:           { label: 'Shipped',                color: 'var(--burgundy)' },
    delivered:         { label: 'Delivered',              color: 'var(--sage)' },
    cancelled:         { label: 'Cancelled',               color: 'var(--brick)' },
    return_requested:  { label: 'Return Requested',        color: 'var(--brick)' },
  };
  function statusMeta(order){
    if(order.status === 'return_requested' && order.return_type === 'replace'){
      return { label: 'Replacement Requested', color: 'var(--brick)' };
    }
    return STATUS_META[order.status] || { label: order.status || 'Placed', color: 'var(--charcoal-soft)' };
  }

  async function loadOrders(){
    const { data, error } = await sb.from('orders')
      .select('id,user_id,total,subtotal,shipping,status,payment_method,created_at,customer_name,phone,address,city,state,pincode,courier_name,awb_number,tracking_status,return_type,return_reason')
      .order('created_at', { ascending: false });
    if(error){ console.error(error); showToast("Couldn't load orders"); return; }
    orders = data || [];
    renderFilterTabs();
    renderOrders();
  }

  function renderFilterTabs(){
    const counts = { all: orders.length };
    orders.forEach(o => { counts[o.status] = (counts[o.status] || 0) + 1; });
    const tabs = [
      ['all', 'All'], ['placed', 'Placed'], ['pending_payment', 'Payment Pending'],
      ['processing', 'Processing'], ['shipped', 'Shipped'], ['delivered', 'Delivered'],
      ['return_requested', 'Returns'], ['cancelled', 'Cancelled']
    ];
    const el = document.getElementById('filterTabs');
    el.innerHTML = tabs.map(([key, label]) => `
      <button class="tab ${activeFilter === key ? 'active' : ''}" onclick="setFilter('${key}')">
        ${label}${counts[key] ? ` (${counts[key]})` : (key === 'all' ? ` (${counts.all})` : '')}
      </button>
    `).join('') + `<input class="search" placeholder="Search order ID, name, or phone…" value="${searchTerm}" oninput="setSearch(this.value)">`;
  }
  function setFilter(key){ activeFilter = key; renderFilterTabs(); renderOrders(); }
  function setSearch(val){ searchTerm = val.toLowerCase(); renderOrders(); }

  function filteredOrders(){
    return orders.filter(o => {
      if(activeFilter !== 'all' && o.status !== activeFilter) return false;
      if(!searchTerm) return true;
      return (o.id || '').toLowerCase().includes(searchTerm)
        || (o.customer_name || '').toLowerCase().includes(searchTerm)
        || (o.phone || '').toLowerCase().includes(searchTerm);
    });
  }

  function renderOrders(){
    const list = filteredOrders();
    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';

    document.getElementById('orderTbody').innerHTML = list.map(o => {
      const m = statusMeta(o);
      return `
        <tr onclick="openDrawer('${o.id}')">
          <td class="oid">${o.id}</td>
          <td>${new Date(o.created_at).toLocaleDateString()}</td>
          <td>${o.customer_name || '—'}</td>
          <td>₹${o.total}</td>
          <td><span class="status-dot" style="background:${m.color};"></span>${m.label}</td>
        </tr>`;
    }).join('');

    document.getElementById('orderCards').innerHTML = list.map(o => {
      const m = statusMeta(o);
      return `
        <div class="order-card" onclick="openDrawer('${o.id}')">
          <div class="row1"><span>${o.id}</span><span>₹${o.total}</span></div>
          <div class="row2">
            <span>${o.customer_name || '—'} · ${new Date(o.created_at).toLocaleDateString()}</span>
            <span><span class="status-dot" style="background:${m.color};"></span>${m.label}</span>
          </div>
        </div>`;
    }).join('');
  }

  /* ---------- Detail drawer ---------- */
  async function openDrawer(orderId){
    selectedOrderId = orderId;
    document.getElementById('scrim').classList.add('open');
    document.getElementById('drawer').classList.add('open');
    renderDrawer(); // loading state
    const { data: items, error } = await sb.from('order_items').select('product_name,price,qty').eq('order_id', orderId);
    if(error) console.error(error);
    selectedOrderItems = items || [];
    renderDrawer();
  }
  function closeDrawer(){
    document.getElementById('scrim').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
    selectedOrderId = null;
  }
  function renderDrawer(){
    const order = orders.find(o => o.id === selectedOrderId);
    const body = document.getElementById('drawerBody');
    if(!order){ body.innerHTML = ''; return; }
    const m = statusMeta(order);

    body.innerHTML = `
      <span class="eyebrow">Order ${order.id}</span>
      <h2 style="font-size:22px; margin-top:6px;">${new Date(order.created_at).toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'})}</h2>
      <p style="margin-top:6px; color:var(--charcoal-soft); font-size:14px;">
        <span class="status-dot" style="background:${m.color};"></span>${m.label} · ${order.payment_method || '—'}
      </p>

      <div class="drawer-section">
        <span class="label">Items</span>
        <div style="margin-top:8px;">
          ${selectedOrderItems.length ? selectedOrderItems.map(it => `
            <div class="item-row">
              <div>
                <div style="font-weight:600;">${it.product_name}</div>
                <div style="font-size:12px; color:var(--charcoal-soft);">Qty ${it.qty} × ₹${it.price}</div>
              </div>
              <div style="font-weight:600; white-space:nowrap;">₹${(it.price * it.qty).toFixed(2)}</div>
            </div>
          `).join('') : `<p style="font-size:13px; color:var(--charcoal-soft); padding:8px 0;">Loading…</p>`}
        </div>
        <div class="totals-row"><span>Subtotal</span><span>₹${order.subtotal}</span></div>
        <div class="totals-row"><span>Delivery Charge</span><span>${Number(order.shipping) === 0 ? 'Free' : '₹' + order.shipping}</span></div>
        <div class="totals-row grand"><span>Total</span><span>₹${order.total}</span></div>
      </div>

      <div class="drawer-section">
        <span class="label">Ship To</span>
        <div class="addr">
          ${order.customer_name || ''}<br>
          ${order.address || ''}${order.address ? ',' : ''} ${order.city || ''}, ${order.state || ''} – ${order.pincode || ''}<br>
          Phone: ${order.phone || '—'}
        </div>
      </div>

      ${order.return_reason ? `
        <div class="drawer-section">
          <span class="label">${order.return_type === 'replace' ? 'Replacement' : 'Return'} Reason</span>
          <p style="margin-top:6px; font-size:14px;">${order.return_reason}</p>
        </div>
      ` : ''}

      <div class="drawer-section">
        <span class="label">Update Status</span>
        <div class="field" style="margin-top:10px;">
          <select id="statusSelect" onchange="onStatusSelectChange()">
            ${['placed','pending_payment','processing','shipped','delivered','cancelled','return_requested']
              .map(s => `<option value="${s}" ${order.status === s ? 'selected' : ''}>${STATUS_META[s]?.label || s}</option>`).join('')}
          </select>
        </div>
        <div id="courierFields" style="display:${order.status === 'shipped' ? 'block' : 'none'};">
          <div class="field">
            <label>Courier Name</label>
            <input type="text" id="courierName" value="${order.courier_name || ''}" placeholder="e.g. Delhivery">
          </div>
          <div class="field">
            <label>AWB / Tracking Number</label>
            <input type="text" id="awbCode" value="${order.awb_number || ''}" placeholder="e.g. 14829384756">
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:16px;" onclick="saveStatus()">Save Status</button>
      </div>
    `;
  }
  function onStatusSelectChange(){
    const val = document.getElementById('statusSelect').value;
    document.getElementById('courierFields').style.display = val === 'shipped' ? 'block' : 'none';
  }
  async function saveStatus(){
    const order = orders.find(o => o.id === selectedOrderId);
    if(!order) return;
    const newStatus = document.getElementById('statusSelect').value;
    const update = { status: newStatus };
    if(newStatus === 'shipped'){
      update.courier_name = document.getElementById('courierName').value.trim();
      update.awb_number = document.getElementById('awbCode').value.trim();
      update.tracking_status = 'processing';
    }
    if(newStatus === 'delivered'){
      update.tracking_status = 'delivered';
    }
    const { error } = await sb.from('orders').update(update).eq('id', order.id);
    if(error){
      showToast("Couldn't update order — try again");
      console.error(error);
      return;
    }
    Object.assign(order, update);
    renderFilterTabs();
    renderOrders();
    renderDrawer();
    showToast('Order updated');
    // Let the customer know their status changed — non-blocking, so a
    // mail hiccup never undoes or blocks the status update itself.
    sb.functions.invoke('send-order-email', { body: { orderId: order.id, event: 'status_update' } })
      .catch(err => console.error('Status update email failed:', err));
  }
</script>
</body>
</html>
