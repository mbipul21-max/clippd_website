<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPPD — Admin Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
			background: #faf8f6;
			color: #2d2d2d;
			overflow-x: hidden;
		}

		.container {
			display: flex;
			height: 100vh;
		}

		.sidebar {
			width: 250px;
			background: #3d1a1a;
			color: #f5f0ed;
			padding: 20px;
			overflow-y: auto;
			position: fixed;
			left: 0;
			top: 0;
			height: 100vh;
		}

		.sidebar-logo {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 30px;
		}

		.sidebar-logo img {
			height: 44px;
			width: auto;
			display: block;
		}

		.sidebar-logo span {
			font-family: 'Fraunces', Georgia, serif;
			font-weight: 600;
			font-size: 26px;
			letter-spacing: 0.02em;
			color: #f5f0ed;
		}

		.sidebar h2 {
			font-size: 18px;
			margin-bottom: 30px;
			color: #f5f0ed;
		}

		.sidebar .nav-item {
			padding: 12px 16px;
			margin-bottom: 8px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
			transition: all 0.3s;
			border-left: 3px solid transparent;
		}

		.sidebar .nav-item:hover {
			background: rgba(245, 240, 237, 0.1);
		}

		.sidebar .nav-item.active {
			background: #6b2d2d;
			border-left-color: #c77373;
		}

		.main-content {
			margin-left: 250px;
			flex: 1;
			overflow-y: auto;
			padding: 30px;
		}

		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 30px;
		}

		.header h1 {
			font-size: 28px;
			color: #3d1a1a;
		}

		.logout-btn {
			padding: 10px 20px;
			background: #c77373;
			color: white;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
		}

		.logout-btn:hover {
			background: #a85a5a;
		}

		.section {
			display: none;
		}

		.section.active {
			display: block;
		}

		/* KPI Cards */
		.kpi-cards {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.kpi-card {
			background: white;
			padding: 24px;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}

		.kpi-label {
			font-size: 12px;
			color: #8b7b7b;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 8px;
		}

		.kpi-value {
			font-size: 28px;
			font-weight: 600;
			color: #3d1a1a;
			margin-bottom: 8px;
		}

		.kpi-change {
			font-size: 12px;
			color: #6b9e3d;
		}

		/* Tables */
		.table-container {
			background: white;
			padding: 24px;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
			overflow-x: auto;
		}

		.table-container h3 {
			margin-bottom: 16px;
			font-size: 16px;
			color: #3d1a1a;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 14px;
		}

		table thead {
			background: #faf8f6;
		}

		table th {
			padding: 12px;
			text-align: left;
			font-weight: 600;
			color: #3d1a1a;
			border-bottom: 2px solid #e0d8d6;
		}

		table td {
			padding: 12px;
			border-bottom: 1px solid #e0d8d6;
		}

		table tbody tr:hover {
			background: #faf8f6;
		}

		/* Report Filters */
		.filter-section {
			background: white;
			padding: 20px;
			border-radius: 8px;
			margin-bottom: 24px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}

		.filter-group {
			display: flex;
			gap: 16px;
			flex-wrap: wrap;
			align-items: center;
		}

		.filter-group label {
			font-size: 14px;
			color: #3d1a1a;
			font-weight: 500;
		}

		.filter-group select,
		.filter-group input {
			padding: 8px 12px;
			border: 1px solid #d9d1cf;
			border-radius: 4px;
			font-size: 14px;
		}

		.filter-group button {
			padding: 8px 20px;
			background: #c77373;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
		}

		.filter-group button:hover {
			background: #a85a5a;
		}

		/* Chart Container */
		.chart-container {
			background: white;
			padding: 24px;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
			margin-bottom: 24px;
		}

		.chart-container h3 {
			margin-bottom: 16px;
			font-size: 16px;
			color: #3d1a1a;
		}

		.chart-bar {
			display: flex;
			align-items: flex-end;
			gap: 8px;
			height: 300px;
		}

		.bar {
			flex: 1;
			background: #c77373;
			border-radius: 4px 4px 0 0;
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			align-items: center;
			cursor: pointer;
			transition: all 0.3s;
		}

		.bar:hover {
			background: #a85a5a;
		}

		.bar-label {
			position: absolute;
			bottom: -25px;
			font-size: 12px;
			color: #3d1a1a;
			width: 100%;
			text-align: center;
		}

		.bar-value {
			color: white;
			font-weight: 600;
			margin-bottom: 8px;
			font-size: 12px;
		}

		/* Loading States */
		.loading {
			text-align: center;
			padding: 40px;
			color: #8b7b7b;
		}

		.spinner {
			border: 3px solid #e0d8d6;
			border-top: 3px solid #c77373;
			border-radius: 50%;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin: 0 auto 16px;
		}

		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* Modal */
		.modal {
			display: none;
			position: fixed;
			z-index: 1000;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0,0,0,0.5);
			animation: fadeIn 0.3s ease;
		}

		.modal.active {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.modal-content {
			background-color: white;
			padding: 30px;
			border-radius: 8px;
			width: 90%;
			max-width: 600px;
			max-height: 90vh;
			overflow-y: auto;
			box-shadow: 0 10px 40px rgba(0,0,0,0.2);
		}

		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 24px;
			padding-bottom: 16px;
			border-bottom: 2px solid #e0d8d6;
		}

		.modal-header h2 {
			font-size: 20px;
			color: #3d1a1a;
			font-weight: 600;
		}

		.close-btn {
			background: none;
			border: none;
			font-size: 28px;
			cursor: pointer;
			color: #8b7b7b;
			line-height: 1;
		}

		.close-btn:hover {
			color: #3d1a1a;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
			}
			to {
				opacity: 1;
			}
		}

		@keyframes slideIn {
			from {
				transform: translateX(400px);
				opacity: 0;
			}
			to {
				transform: translateX(0);
				opacity: 1;
			}
		}

		.status-badge {
			display: inline-block;
			padding: 4px 12px;
			border-radius: 20px;
			font-size: 12px;
			font-weight: 500;
		}

		/* Payment Method Badges */
		.status-cod {
			background: #fff3cd;
			color: #856404;
		}

		.status-prepaid {
			background: #d1ecf1;
			color: #0c5460;
		}

		.status-online {
			background: #d1ecf1;
			color: #0c5460;
		}

		/* Order Status Badges */
		.status-pending {
			background: #fff3cd;
			color: #856404;
		}

		.status-confirmed {
			background: #d1ecf1;
			color: #0c5460;
		}

		.status-shipped {
			background: #cfe2ff;
			color: #084298;
		}

		.status-delivered {
			background: #d1e7dd;
			color: #0f5132;
		}

		.status-returned {
			background: #f8d7da;
			color: #721c24;
		}

		.status-cancelled {
			background: #f5f5f5;
			color: #333;
		}

		.status-cancel {
			background: #f5f5f5;
			color: #333;
		}

		/* Responsive */
		@media (max-width: 768px) {
			.sidebar {
				width: 100%;
				height: auto;
				position: relative;
				margin-bottom: 20px;
			}

			.main-content {
				margin-left: 0;
			}

			.kpi-cards {
				grid-template-columns: 1fr;
			}

			.filter-group {
				flex-direction: column;
				align-items: flex-start;
			}
		}
	</style>
</head>

	<script>
		// Supabase Configuration
		const supabaseUrl = 'https://tghmxutqpbxrrtlarvmjx.supabase.co';
		const supabaseAnonKey = 'sb_publishable_lr4xdh4MJQQLUA-ZTc4bfQ_I95yCHor';

		// Initialize Supabase client
		const { createClient } = window.supabase;
		const sb = createClient(supabaseUrl, supabaseAnonKey);

		// Auth State
		let currentUser = null;

		// Initialize
		document.addEventListener('DOMContentLoaded', async () => {
			await checkAuth();
			setReportMonth();
			await loadOverview();
		});

		// Auth Functions
		async function checkAuth() {
			const { data: { user } } = await sb.auth.getUser();
			if (!user) {
				window.location.href = 'login.html';
			}
			currentUser = user;
		}

		async function logout() {
			await sb.auth.signOut();
			window.location.href = 'login.html';
		}

		// Section Navigation
		function switchSection(section) {
			// Hide all sections
			document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
			document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
			
			// Show selected section
			document.getElementById(section).classList.add('active');
			event.target.classList.add('active');

			// Load section data
			if (section === 'reports') {
				generateReport();
			} else if (section === 'analytics') {
				loadAnalytics();
			} else if (section === 'orders') {
				loadOrders();
			}
		}

		// Set current month for report
		function setReportMonth() {
			const now = new Date();
			const year = now.getFullYear();
			const month = String(now.getMonth() + 1).padStart(2, '0');
			document.getElementById('reportMonth').value = `${year}-${month}`;
		}

		// Load Overview KPIs
		async function loadOverview() {
			try {
				const { data: orders, error } = await sb
					.from('orders')
					.select('*')
					.order('created_at', { ascending: false });

				if (error) throw error;

				const currentMonth = new Date().getMonth();
				const currentYear = new Date().getFullYear();

				const monthOrders = orders.filter(o => {
					const d = new Date(o.created_at);
					return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
				});

				const totalSales = orders.reduce((sum, o) => sum + (o.total_amount || 0), 0);
				const monthSales = monthOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0);
				const codOrders = monthOrders.filter(o => o.payment_method === 'COD').length;
				const cancelledOrders = monthOrders.filter(o => o.status === 'cancelled').length;

				const kpiHtml = `
					<div class="kpi-card">
						<div class="kpi-label">Total Revenue</div>
						<div class="kpi-value">₹${(totalSales || 0).toLocaleString()}</div>
						<div class="kpi-change">All time</div>
					</div>
					<div class="kpi-card">
						<div class="kpi-label">This Month Sales</div>
						<div class="kpi-value">₹${(monthSales || 0).toLocaleString()}</div>
						<div class="kpi-change">${monthOrders.length} orders</div>
					</div>
					<div class="kpi-card">
						<div class="kpi-label">COD Orders</div>
						<div class="kpi-value">${codOrders}</div>
						<div class="kpi-change">Cash on Delivery</div>
					</div>
					<div class="kpi-card">
						<div class="kpi-label">Cancelled Orders</div>
						<div class="kpi-value">${cancelledOrders}</div>
						<div class="kpi-change">This month</div>
					</div>
				`;

				document.getElementById('kpiCards').innerHTML = kpiHtml;
			} catch (error) {
				console.error('Error loading overview:', error);
				document.getElementById('kpiCards').innerHTML = '<div class="loading" style="color: red;">Error loading data</div>';
			}
		}

		// Generate Sales Report
		async function generateReport() {
			try {
				const monthStr = document.getElementById('reportMonth').value;
				const [year, month] = monthStr.split('-');

				const { data: orders, error } = await sb
					.from('orders')
					.select('*')
					.gte('created_at', `${year}-${month}-01T00:00:00Z`)
					.lt('created_at', `${year}-${parseInt(month) + 1}-01T00:00:00Z`);

				if (error) throw error;

				const codOrders = orders.filter(o => o.payment_method === 'COD');
				const prepaidOrders = orders.filter(o => o.payment_method === 'PREPAID' || o.payment_method === 'Online');
				const returnedOrders = orders.filter(o => o.status === 'returned');
				const cancelledOrders = orders.filter(o => o.status === 'cancelled');

				const totalSales = orders.reduce((sum, o) => sum + (o.total_amount || 0), 0);
				const codSales = codOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0);
				const prepaidSales = prepaidOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0);

				let reportHtml = `
					<div class="kpi-cards">
						<div class="kpi-card">
							<div class="kpi-label">Total Sales</div>
							<div class="kpi-value">₹${totalSales.toLocaleString()}</div>
							<div class="kpi-change">${orders.length} orders</div>
						</div>
						<div class="kpi-card">
							<div class="kpi-label">COD Sales</div>
							<div class="kpi-value">₹${codSales.toLocaleString()}</div>
							<div class="kpi-change">${codOrders.length} orders</div>
						</div>
						<div class="kpi-card">
							<div class="kpi-label">Prepaid Sales</div>
							<div class="kpi-value">₹${prepaidSales.toLocaleString()}</div>
							<div class="kpi-change">${prepaidOrders.length} orders</div>
						</div>
						<div class="kpi-card">
							<div class="kpi-label">Returns</div>
							<div class="kpi-value">${returnedOrders.length}</div>
							<div class="kpi-change">₹${returnedOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0).toLocaleString()}</div>
						</div>
						<div class="kpi-card">
							<div class="kpi-label">Cancellations</div>
							<div class="kpi-value">${cancelledOrders.length}</div>
							<div class="kpi-change">₹${cancelledOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0).toLocaleString()}</div>
						</div>
					</div>

					<div class="table-container">
						<h3>Detailed Sales Report</h3>
						<table>
							<thead>
								<tr>
									<th>Order ID</th>
									<th>Amount</th>
									<th>Payment Method</th>
									<th>Status</th>
									<th>Date</th>
								</tr>
							</thead>
							<tbody>
								${orders.map(o => `
									<tr onclick="showOrderDetail('${o.id}')">
										<td><strong>#${o.id.substring(0, 8)}</strong></td>
										<td>₹${(o.total_amount || 0).toLocaleString()}</td>
										<td><span class="status-badge status-${(o.payment_method || 'UNKNOWN').toLowerCase()}">${o.payment_method || 'N/A'}</span></td>
										<td><span class="status-badge status-${(o.status || 'unknown').toLowerCase()}">${o.status || 'unknown'}</span></td>
										<td>${new Date(o.created_at).toLocaleDateString()}</td>
									</tr>
								`).join('')}
							</tbody>
						</table>
					</div>

					<div class="chart-container">
						<h3>Sales by Payment Method</h3>
						<div class="chart-bar">
							<div class="bar" style="height: ${(codSales / totalSales * 100) || 10}%">
								<span class="bar-value">₹${codSales.toLocaleString()}</span>
								<span class="bar-label">COD</span>
							</div>
							<div class="bar" style="height: ${(prepaidSales / totalSales * 100) || 10}%">
								<span class="bar-value">₹${prepaidSales.toLocaleString()}</span>
								<span class="bar-label">Prepaid</span>
							</div>
						</div>
					</div>
				`;

				document.getElementById('reportContent').innerHTML = reportHtml;
			} catch (error) {
				console.error('Error generating report:', error);
				document.getElementById('reportContent').innerHTML = '<div class="loading" style="color: red;">Error generating report</div>';
			}
		}

		// Store current orders globally for filtering
		let allOrders = [];

		// Load Orders
		async function loadOrders() {
			try {
				const { data: orders, error } = await sb
					.from('orders')
					.select('*')
					.order('created_at', { ascending: false })
					.limit(100);

				if (error) throw error;

				allOrders = orders;
				document.getElementById('statusFilter').value = '';
				document.getElementById('paymentFilter').value = '';
				renderOrdersTable(orders);
			} catch (error) {
				console.error('Error loading orders:', error);
				document.getElementById('ordersContent').innerHTML = '<div class="loading" style="color: red;">Error loading orders</div>';
			}
		}

		// Load Orders with Filters
		function loadOrdersWithFilter() {
			const statusFilter = document.getElementById('statusFilter').value;
			const paymentFilter = document.getElementById('paymentFilter').value;

			let filtered = allOrders;

			if (statusFilter) {
				filtered = filtered.filter(o => o.status === statusFilter);
			}

			if (paymentFilter) {
				filtered = filtered.filter(o => o.payment_method === paymentFilter);
			}

			renderOrdersTable(filtered);
		}

		// Render Orders Table
		function renderOrdersTable(orders) {
			let html = `
				<div class="table-container">
					<p style="margin-bottom: 16px; color: #8b7b7b;">Showing ${orders.length} orders</p>
					<table>
						<thead>
							<tr>
								<th>Order ID</th>
								<th>Customer</th>
								<th>Amount</th>
								<th>Payment Method</th>
								<th>Status</th>
								<th>Date</th>
								<th>Action</th>
							</tr>
						</thead>
						<tbody>
							${orders.map(o => `
								<tr>
									<td><strong>#${o.id.substring(0, 8)}</strong></td>
									<td>${o.customer_name || 'N/A'}</td>
									<td>₹${(o.total_amount || 0).toLocaleString()}</td>
									<td><span class="status-badge status-${(o.payment_method || 'UNKNOWN').toLowerCase()}">${o.payment_method || 'N/A'}</span></td>
									<td><span class="status-badge status-${(o.status || 'unknown').toLowerCase()}">${o.status || 'unknown'}</span></td>
									<td>${new Date(o.created_at).toLocaleDateString()}</td>
									<td><button onclick="openOrderModal('${o.id}')" style="padding: 6px 12px; background: #c77373; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Update</button></td>
								</tr>
							`).join('')}
						</tbody>
					</table>
				</div>
			`;

			document.getElementById('ordersContent').innerHTML = html;
		}

		// Open Order Modal for Status Update
		async function openOrderModal(orderId) {
			try {
				const { data: order, error } = await sb
					.from('orders')
					.select('*')
					.eq('id', orderId)
					.single();

				if (error) throw error;

				const statuses = ['pending', 'confirmed', 'shipped', 'delivered', 'returned', 'cancelled'];

				const modalHtml = `
					<div class="modal-header">
						<h2>Order #${orderId.substring(0, 8)}</h2>
						<button class="close-btn" onclick="closeModal()">&times;</button>
					</div>
					<div style="margin-bottom: 20px;">
						<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
							<div>
								<label style="font-size: 12px; color: #8b7b7b; text-transform: uppercase;">Customer</label>
								<div style="font-size: 16px; color: #3d1a1a; font-weight: 500;">${order.customer_name || 'N/A'}</div>
							</div>
							<div>
								<label style="font-size: 12px; color: #8b7b7b; text-transform: uppercase;">Email</label>
								<div style="font-size: 16px; color: #3d1a1a; font-weight: 500;">${order.customer_email || 'N/A'}</div>
							</div>
							<div>
								<label style="font-size: 12px; color: #8b7b7b; text-transform: uppercase;">Amount</label>
								<div style="font-size: 16px; color: #3d1a1a; font-weight: 500;">₹${(order.total_amount || 0).toLocaleString()}</div>
							</div>
							<div>
								<label style="font-size: 12px; color: #8b7b7b; text-transform: uppercase;">Payment Method</label>
								<div style="font-size: 16px; color: #3d1a1a; font-weight: 500;">${order.payment_method || 'N/A'}</div>
							</div>
							<div>
								<label style="font-size: 12px; color: #8b7b7b; text-transform: uppercase;">Current Status</label>
								<div style="font-size: 16px; color: #3d1a1a; font-weight: 500;">${order.status || 'unknown'}</div>
							</div>
							<div>
								<label style="font-size: 12px; color: #8b7b7b; text-transform: uppercase;">Date</label>
								<div style="font-size: 16px; color: #3d1a1a; font-weight: 500;">${new Date(order.created_at).toLocaleDateString()}</div>
							</div>
						</div>

						<div style="border-top: 1px solid #e0d8d6; padding-top: 20px;">
							<label style="font-size: 14px; color: #3d1a1a; font-weight: 500; margin-bottom: 8px; display: block;">Update Status</label>
							<select id="statusSelect" style="width: 100%; padding: 10px; border: 1px solid #d9d1cf; border-radius: 4px; font-size: 14px; margin-bottom: 16px;">
								<option value="">-- Select New Status --</option>
								${statuses.map(s => `<option value="${s}" ${order.status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join('')}
							</select>

							<div style="display: flex; gap: 12px;">
								<button onclick="updateOrderStatus('${orderId}')" style="flex: 1; padding: 12px; background: #c77373; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">Update Status & Send Email</button>
								<button onclick="closeModal()" style="flex: 1; padding: 12px; background: #e0d8d6; color: #3d1a1a; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">Cancel</button>
							</div>
						</div>

						<div style="border-top: 1px solid #e0d8d6; margin-top: 20px; padding-top: 20px;">
							<h3 style="margin-bottom: 12px; font-size: 14px; color: #3d1a1a;">Order Items</h3>
							<div style="background: #faf8f6; padding: 12px; border-radius: 4px;">
								<p style="color: #8b7b7b; font-size: 13px;">${order.items_count || 1} item(s) in this order</p>
								<p style="color: #8b7b7b; font-size: 13px; margin-top: 8px;">Total: <strong>₹${(order.total_amount || 0).toLocaleString()}</strong></p>
							</div>
						</div>
					</div>
				`;

				document.getElementById('modalBody').innerHTML = modalHtml;
				document.getElementById('detailModal').classList.add('active');
				window.currentOrderId = orderId; // Store for update function
			} catch (error) {
				console.error('Error opening order:', error);
				alert('Error loading order details');
			}
		}

		// Update Order Status
		async function updateOrderStatus(orderId) {
			try {
				const newStatus = document.getElementById('statusSelect').value;
				
				if (!newStatus) {
					alert('Please select a status');
					return;
				}

				// Get order details for email
				const { data: order, error: fetchError } = await sb
					.from('orders')
					.select('*')
					.eq('id', orderId)
					.single();

				if (fetchError) throw fetchError;

				// Update status
				const { error: updateError } = await sb
					.from('orders')
					.update({ status: newStatus })
					.eq('id', orderId);

				if (updateError) throw updateError;

				// Show success message
				showToast(`Order status updated to ${newStatus}!`);
				
				// Send email notification
				sendStatusUpdateEmail(order, newStatus);

				// Close modal and reload orders
				closeModal();
				loadOrders();
			} catch (error) {
				console.error('Error updating order:', error);
				alert('Error updating order: ' + error.message);
			}
		}

		// Send Status Update Email
		function sendStatusUpdateEmail(order, newStatus) {
			// This calls your Supabase Edge Function for sending emails
			// The function will not block the status update if it fails
			sb.functions.invoke('send-order-email', {
				body: {
					orderId: order.id,
					customerEmail: order.customer_email,
					customerName: order.customer_name,
					event: 'status_update',
					newStatus: newStatus,
					orderAmount: order.total_amount
				}
			}).catch(err => {
				console.error('Email notification failed:', err);
				// Email failure doesn't affect the order status update
			});
		}

		// Toast Notification
		function showToast(message) {
			const toast = document.createElement('div');
			toast.textContent = message;
			toast.style.cssText = `
				position: fixed;
				bottom: 20px;
				right: 20px;
				background: #4caf50;
				color: white;
				padding: 16px 24px;
				border-radius: 4px;
				z-index: 10000;
				animation: slideIn 0.3s ease;
			`;
			document.body.appendChild(toast);
			setTimeout(() => toast.remove(), 3000);
		}

		// Load Analytics
		async function loadAnalytics() {
			try {
				const { data: orders, error } = await sb
					.from('orders')
					.select('*')
					.order('created_at', { ascending: false });

				if (error) throw error;

				// Daily sales data for last 30 days
				const last30Days = {};
				const today = new Date();
				for (let i = 30; i >= 0; i--) {
					const d = new Date(today);
					d.setDate(d.getDate() - i);
					const key = d.toISOString().split('T')[0];
					last30Days[key] = 0;
				}

				orders.forEach(o => {
					const date = o.created_at.split('T')[0];
					if (last30Days.hasOwnProperty(date)) {
						last30Days[date] += o.total_amount || 0;
					}
				});

				const dates = Object.keys(last30Days);
				const maxSales = Math.max(...Object.values(last30Days), 1);

				let html = `
					<div class="chart-container">
						<h3>Last 30 Days Sales Trend</h3>
						<div class="chart-bar">
							${dates.map(date => {
								const sales = last30Days[date];
								const barHeight = (sales / maxSales * 100);
								return `
									<div class="bar" style="height: ${Math.max(barHeight, 5)}%">
										<span class="bar-value">₹${Math.round(sales / 1000)}k</span>
										<span class="bar-label">${new Date(date).toLocaleDateString('en-IN', { month: 'short', day: 'numeric' })}</span>
									</div>
								`;
							}).join('')}
						</div>
					</div>

					<div class="table-container">
						<h3>Top 10 Products by Revenue</h3>
						<table>
							<thead>
								<tr>
									<th>Product Name</th>
									<th>Orders</th>
									<th>Total Revenue</th>
									<th>Avg Price</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td colspan="4" style="text-align: center; color: #8b7b7b;">Loading product data...</td>
								</tr>
							</tbody>
						</table>
					</div>
				`;

				document.getElementById('analyticsContent').innerHTML = html;
			} catch (error) {
				console.error('Error loading analytics:', error);
				document.getElementById('analyticsContent').innerHTML = '<div class="loading" style="color: red;">Error loading analytics</div>';
			}
		}

		// Modal Functions
		function closeModal() {
			document.getElementById('detailModal').classList.remove('active');
			document.getElementById('modalBody').innerHTML = '';
			window.currentOrderId = null;
		}

		// Supabase Client via CDN
		const script = document.createElement('script');
		script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
		script.onload = () => {
			console.log('Supabase loaded');
		};
		document.head.appendChild(script);
	</script>
</body>
